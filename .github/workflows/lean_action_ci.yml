name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          test: false

      - name: Run the cryptography tests
        run: lake exe crypto-tests

      - name: Restore the execution-spec-tests fixtures
        uses: actions/cache@v4
        with:
          path: .cache/eest/fixtures-tests-v21.0.2.tar.gz
          key: eest-fixtures-v21.0.2

      - name: Run the fixture conformance tests
        run: lake test 2> conformance-stderr.txt

      - name: Show failing conformance tests
        if: failure()
        run: cat .cache/conform/failures.txt || true
